<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Hub</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #8a90a0;
    --accent: #5b9cff;
    --ok: #3ddc97;
    --warn: #ffb84d;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .gpu-name { font-size: 15px; margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-track { flex: 1; height: 8px; border-radius: 4px; background: #2a2f3a; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-label { width: 90px; color: var(--muted); }
  .bar-value { width: 90px; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 10px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-running { background: rgba(61,220,151,.15); color: var(--ok); }
  .badge-queued { background: rgba(255,184,77,.15); color: var(--warn); }
  .badge-completed { background: rgba(91,156,255,.15); color: var(--accent); }
  .badge-failed { background: rgba(255,107,107,.15); color: var(--err); }
  .updated { color: var(--muted); font-size: 11px; margin-top: 16px; }
</style>
</head>
<body>
  <h1>GPU Hub</h1>
  <div class="subtitle">Quem está usando a GPU compartilhada agora</div>

  <div class="grid">
    <div class="card" id="gpu-card">
      <h2>GPU</h2>
      <div id="gpu-content">carregando...</div>
    </div>
    <div class="card">
      <h2>Rodando agora</h2>
      <div id="running-content">carregando...</div>
    </div>
    <div class="card">
      <h2>Na fila</h2>
      <div id="queued-content">carregando...</div>
    </div>
  </div>

  <div class="card">
    <h2>Histórico recente</h2>
    <table>
      <thead>
        <tr><th>Usuário</th><th>Job</th><th>Status</th><th>Duração</th><th>Quando</th></tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

  <div class="updated" id="updated-at"></div>

<script>
function fmtDuration(seconds) {
  if (seconds == null) return "-";
  if (seconds < 60) return seconds.toFixed(0) + "s";
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m + "m " + s + "s";
}

function fmtTime(ts) {
  if (!ts) return "-";
  return new Date(ts * 1000).toLocaleString("pt-BR");
}

function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}

async function refresh() {
  try {
    const [statusRes, gpuRes] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/gpu").then(r => r.json()),
    ]);
    renderGpu(gpuRes);
    renderRunning(statusRes.running);
    renderQueued(statusRes.queued);
    renderHistory(statusRes.history);
    document.getElementById("updated-at").textContent =
      "atualizado em " + new Date().toLocaleTimeString("pt-BR");
  } catch (e) {
    document.getElementById("updated-at").textContent = "erro ao atualizar: " + e;
  }
}

function renderGpu(gpus) {
  const el = document.getElementById("gpu-content");
  if (gpus.error) {
    el.innerHTML = `<div class="empty">${gpus.error}</div>`;
    return;
  }
  el.innerHTML = gpus.map(g => `
    <div class="gpu-name">${g.name}</div>
    <div class="bar-row">
      <div class="bar-label">Uso</div>
      <div class="bar-track"><div class="bar-fill" style="width:${g.utilization_pct}%"></div></div>
      <div class="bar-value">${g.utilization_pct.toFixed(0)}%</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">VRAM</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(g.memory_used_mb / g.memory_total_mb) * 100}%"></div></div>
      <div class="bar-value">${(g.memory_used_mb/1024).toFixed(1)}/${(g.memory_total_mb/1024).toFixed(1)} GB</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Temp.</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(g.temperature_c,100)}%"></div></div>
      <div class="bar-value">${g.temperature_c.toFixed(0)}°C</div>
    </div>
  `).join("");
}

function renderRunning(jobs) {
  const el = document.getElementById("running-content");
  if (!jobs.length) {
    el.innerHTML = `<div class="empty">GPU livre</div>`;
    return;
  }
  el.innerHTML = jobs.map(j => `
    <div style="margin-bottom:10px">
      <div><strong>${j.user}</strong> — ${j.name}</div>
      <div style="color:var(--muted);font-size:12px">
        rodando há ${fmtDuration((Date.now()/1000) - j.started_at)}
      </div>
    </div>
  `).join("");
}

function renderQueued(jobs) {
  const el = document.getElementById("queued-content");
  if (!jobs.length) {
    el.innerHTML = `<div class="empty">Ninguém esperando</div>`;
    return;
  }
  el.innerHTML = jobs.map(j => `
    <div style="margin-bottom:10px">
      <div><strong>${j.user}</strong> — ${j.name}</div>
      <div style="color:var(--muted);font-size:12px">
        esperando há ${fmtDuration((Date.now()/1000) - j.submitted_at)}
      </div>
    </div>
  `).join("");
}

function renderHistory(jobs) {
  const body = document.getElementById("history-body");
  if (!jobs.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty">Sem histórico ainda</td></tr>`;
    return;
  }
  body.innerHTML = jobs.map(j => {
    const duration = (j.started_at && j.ended_at) ? j.ended_at - j.started_at : null;
    return `<tr>
      <td>${j.user}</td>
      <td>${j.name}</td>
      <td>${badge(j.status)}</td>
      <td>${fmtDuration(duration)}</td>
      <td>${fmtTime(j.ended_at)}</td>
    </tr>`;
  }).join("");
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
