services:
  gpuhub:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hub
    image: gpuhub:latest
    container_name: gpuhub
    restart: unless-stopped
    volumes:
      - /data:/data:rw
      - /data/pesquisa:/mnt/pesquisa:rw
    group_add:
      - "1009"   # lab
      - "1003"   # vigia

    shm_size: "16gb"
    # host networking evita ter que mapear as portas dinâmicas do Ray uma a uma.
    # Efeito colateral que importa: com host networking o ufw vale pro container
    # (com bridge + ports, o Docker fura o ufw). Se algum dia trocar pra bridge,
    # as regras de firewall param de valer sem avisar.
    network_mode: host
    environment:
      # O Ray nasce em 127.0.0.1: quem entra de fora entra pelo caddy.
      GPUHUB_DASHBOARD_HOST: "127.0.0.1"
    # GPU via CDI (Container Device Interface), nao pelo caminho legado.
    # Motivo: com o device-request/hook legado em cgroupv2, um `systemctl
    # daemon-reload` zera o allowlist de devices do container rodando e ele
    # perde a GPU ("Failed to initialize NVML") ate ser reiniciado. Pelo CDI
    # o device vira first-class conhecido pelo Docker, reaplicado no reload.
    # Spec: sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    devices:
      - "nvidia.com/gpu=all"

  # Porta de entrada: TLS + validação de JWT do Keycloak na frente da Jobs API.
  # Sem isso, o hub é execução de código arbitrário pra quem alcança a 8265.
  caddy:
    image: gpuhub-caddy:jwt
    container_name: gpuhub-caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gpuhub
    environment:
      # Campus: gpuhub.local + CA interna. Público: o domínio real + um e-mail
      # (que liga o Let's Encrypt). Definidos em docker/.env — veja .env.example.
      GPUHUB_SITE_ADDRESS: "${GPUHUB_SITE_ADDRESS:-gpuhub.local}"
      GPUHUB_TLS: "${GPUHUB_TLS:-internal}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/users.caddy:/etc/caddy/users.caddy:ro
      # Servidos sem autenticação em /install e /gpuhub: é como uma máquina
      # nova do lab se prepara antes de ter credencial.
      - ../bin:/srv/pub/bin:ro
      - ../scripts:/srv/pub/scripts:ro
      # Guarda a CA interna e os certificados. Se este volume sumir, a CA é
      # regerada e todo mundo precisa baixar o ca.crt de novo.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

  # Drive web do /data (estilo Google Drive). Roda como uid 2000 + grupos
  # lab/vigia (mesmo dono que o hub usa) pra ler/escrever /data respeitando as
  # permissões. Escuta só em 127.0.0.1:8090 — quem entra, entra pelo Caddy (/files).
  filebrowser:
    image: filebrowser/filebrowser:v2.32.0
    container_name: gpuhub-filebrowser
    restart: unless-stopped
    network_mode: host
    user: "2000:2000"
    group_add:
      - "1009"   # lab
      - "1003"   # vigia
    environment:
      FB_ADDRESS: "127.0.0.1"
      FB_PORT: "8090"
      FB_BASEURL: "/files"
      FB_ROOT: "/data"
      FB_DATABASE: "/config/filebrowser.db"
    volumes:
      - /data:/data:rw
      - fb_config:/config

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  fb_config:
